# ===================================================================
# Mini D-Mart Backend Configuration
# ===================================================================
spring.application.name=mini-dmart-backend
server.port=8082

# ===================================================================
# Database Configuration
# Defaults to H2 (PostgreSQL Mode) for instant local zero-setup execution.
# Overridden seamlessly by env variables in production (Render/Railway/PostgreSQL).
# ===================================================================
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:minidmartdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
spring.datasource.driverClassName=${DATABASE_DRIVER:org.h2.Driver}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

# ===================================================================
# JPA & Hibernate
# ===================================================================
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# H2 Web Console (Disabled in production)
# ===================================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ===================================================================
# Security & JWT Configuration
# ===================================================================
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# 24 Hours in milliseconds = 86400000
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================================================================
# CORS Configuration
# ===================================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4173}

# ===================================================================
# Business Rules Configuration
# ===================================================================
app.delivery.free-threshold=500.0
app.delivery.standard-fee=40.0
app.pickup.default-slot-capacity=10
app.returns.eligibility-days=7
